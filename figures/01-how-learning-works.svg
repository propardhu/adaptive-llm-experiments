   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e79" x="57.6" y="45.957656" transform="rotate(-0 57.6 45.957656)">LEARNING DURING USE  /  THE IDEA</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 31px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152f3d" x="57.6" y="96.275156" transform="rotate(-0 57.6 96.275156)">Two ways to carry an experience forward</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="57.6" y="132.556875" transform="rotate(-0 57.6 132.556875)">The key difference is where the information lives.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #426c99" x="57.6" y="196.155937" transform="rotate(-0 57.6 196.155937)">Use saved context</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e79" x="633.6" y="196.155937" transform="rotate(-0 633.6 196.155937)">Update selected weights</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #426c99" x="79.2" y="262.31625" transform="rotate(-0 79.2 262.31625)">Saved note + new question</text>
   </g>
   <g id="text_7">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="79.2" y="291.637031" transform="rotate(-0 79.2 291.637031)">Relevant information enters the prompt</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e79" x="655.2" y="262.31625" transform="rotate(-0 655.2 262.31625)">Selected experience</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="655.2" y="291.637031" transform="rotate(-0 655.2 291.637031)">Examples provide a learning signal</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e79" x="885.6" y="344.086875" transform="rotate(-0 885.6 344.086875)">Loss → gradients</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #426c99" x="79.2" y="420.71625" transform="rotate(-0 79.2 420.71625)">Model reads the context</text>
   </g>
   <g id="text_12">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="79.2" y="450.037031" transform="rotate(-0 79.2 450.037031)">Existing weights stay fixed</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e79" x="655.2" y="420.71625" transform="rotate(-0 655.2 420.71625)">Use adapted weights</text>
   </g>
   <g id="text_14">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="655.2" y="450.037031" transform="rotate(-0 655.2 450.037031)">An optimizer changes selected parameters</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152f3d" x="57.6" y="523.596563" transform="rotate(-0 57.6 523.596563)">Keep the note for future prompts</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152f3d" x="633.6" y="523.596563" transform="rotate(-0 633.6 523.596563)">Save the update for later sessions</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="57.6" y="555.196875" transform="rotate(-0 57.6 555.196875)">External memory can persist.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="633.6" y="555.196875" transform="rotate(-0 633.6 555.196875)">Adapted parameters can persist.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506574" x="57.6" y="649.3575" transform="rotate(-0 57.6 649.3575)">These approaches can work together. A weight update does not guarantee better answers or lower cost.</text>

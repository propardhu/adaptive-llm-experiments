   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f79" x="50.4" y="40.877813" transform="rotate(-0 50.4 40.877813)">TITANS INSPIRED MEMORY  /  THE IDEA</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 30px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17313d" x="50.4" y="89.035313" transform="rotate(-0 50.4 89.035313)">Two parts with different jobs</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526977" x="50.4" y="125.317031" transform="rotate(-0 50.4 125.317031)">One part stays fixed. A separate memory learns as information arrives.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #426e9a" x="69.12" y="217.636406" transform="rotate(-0 69.12 217.636406)">The part that stays fixed</text>
   </g>
   <g id="text_5">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(69.12 252.757031)">Prepares incoming information</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(69.12 274.754727)">Guides the memory’s updates</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(69.12 296.752422)">Stays unchanged during use</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f79" x="699.12" y="217.636406" transform="rotate(-0 699.12 217.636406)">The memory that learns</text>
   </g>
   <g id="text_7">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(699.12 252.757031)">Stores associations in its own weights</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(699.12 274.754727)">Changes as new information arrives</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(699.12 296.752422)">Can be saved or reset</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(523.902656 210.957187)">Information</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(517.047187 231.797109)">to remember</text>
   </g>
   <g id="text_9">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #087f79" transform="translate(496.920781 293.717344)">Small adjustments</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #087f79" transform="translate(493.462344 313.399492)">to memory weights</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f79" x="699.12" y="440.836406" transform="rotate(-0 699.12 440.836406)">Recall what was learned</text>
   </g>
   <g id="text_11">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526977" x="699.12" y="475.957031" transform="rotate(-0 699.12 475.957031)">Use a learned association to answer</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #426e9a" x="69.12" y="440.836406" transform="rotate(-0 69.12 440.836406)">Choose what to keep</text>
   </g>
   <g id="text_13">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(69.12 475.957031)">Save, reload or reset the memory</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #526977" transform="translate(69.12 497.954727)">Rebuild it from trusted information</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17313d" x="50.4" y="574.915781" transform="rotate(-0 50.4 574.915781)">A separate memory still learns into weights.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526977" x="50.4" y="605.596875" transform="rotate(-0 50.4 605.596875)">Weights are the internal numbers that determine what the memory recalls.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526977" x="50.4" y="647.157656" transform="rotate(-0 50.4 647.157656)">This shows the small memory system we tested. It is not a complete AI assistant or a full Titans model.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17313d" x="50.4" y="701.038125" transform="rotate(-0 50.4 701.038125)">PARTHA SAI GUTTIKONDA</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526977" x="1101.6" y="701.038125" transform="rotate(-0 1101.6 701.038125)">partha_systems.ai</text>
   </g>
  </g>
 </g>
